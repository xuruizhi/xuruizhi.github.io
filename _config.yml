# ============================================================
# 站点主配置 · beautiful-jekyll 6.0.1
# 构建：GitHub Actions（见 .github/workflows/pages.yml）
# 本地预览：bundle exec jekyll serve
# ============================================================

############################
# --- 基本信息 ---
############################
title: 安身、立命、静心、养性
author: Xu Ruizhi
description: >-
  一名全职爸爸的 AI 工程笔记：AI 辅助教学。

# 站点定位（首页副标题）
tagline: 一名全职爸爸的 AI 工程笔记

url: "https://xuruizhi.github.io"
baseurl: ""
url-pretty: "xuruizhi.github.io"

timezone: "Asia/Shanghai"

############################
# --- 首页 ---
############################
title-on-all-pages: false
excerpt_length: 80
paginate: 10

############################
# --- 导航 ---
############################
navbar-links:
  首页: ""
  分类: "categories"
  搜索: "search"
  标签: "tags"
  关于: "about"
# 第二个标签名用自定义页面时，可在该页面 front matter 里写 title

############################
# --- 头像 ---
############################
avatar: "/assets/img/avatar-icon.png"
round-avatar: true

############################
# --- 社交 ---
############################
social-network-links:
  email: "ruizhi_xu@163.com"
  github: xuruizhi
  rss: true

share-links-active:
  twitter: false
  facebook: false
  linkedin: false
  vk: false
  reddit: false
  stumbleupon: false
  pinterest: false
  pocket: false
  flipboard: false
  weibo: false

############################
# --- 配色（极简黑白）---
############################
navbar-col: "#FFFFFF"
navbar-text-col: "#111111"
navbar-border-col: "#E5E5E5"
page-col: "#FFFFFF"
text-col: "#1A1A1A"
link-col: "#111111"
hover-col: "#666666"
footer-col: "#FAFAFA"
footer-text-col: "#666666"
footer-link-col: "#111111"
footer-border-col: "#E5E5E5"

############################
# --- 构建 ---
############################
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - theme-compare-3.png
  - vendor

# 自定义样式（叠加在主题之上）
site-css:
  - "/assets/css/main-custom.css"

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

# ------------------------------------------------------------
# 栏目（分类）：全站唯一的内容目录
# slug 对应文章 front matter 里的 categories 值
# ------------------------------------------------------------
categories_index:
  - slug: ai-assisted-edu
    name: AI 辅助教学
    description: "Copilot 式补全只是开始，探索 AI 在教学里的真实应用。"
  - slug: engineering
    name: 工程底子
    description: "Git 与协作流程"
  - slug: notes
    name: 杂记
    description: "读书笔记、工作方法、踩坑记录 —— 不成体系但在沉淀的部分。"
